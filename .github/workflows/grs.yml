name: Update Repo Cards

on:
  schedule:
    - cron: "0 1 * * *" # Runs daily at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: update-repo-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }} # latest branch tip, even on re-runs

      - name: Generate Mario64 repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Mario64&theme=react&bg_color=1F222E&title_color=F8D866&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/repo-Mario64.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate nzp repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=nzp&theme=react&bg_color=1F222E&title_color=F8D866&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/repo-nzp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate webXash repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=webXash&theme=react&bg_color=1F222E&title_color=F8D866&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/repo-webXash.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit repo cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update repo cards"
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push
